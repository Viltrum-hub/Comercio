name: Verificar NovaMarket
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxis
        run: |
          node --check app.js
          node --check core.js
      - name: Verificar carrito, precios y filtros
        run: node --test tests/*.test.cjs
      - name: Verificar páginas y enlaces
        run: python3 tests/pages.test.py
